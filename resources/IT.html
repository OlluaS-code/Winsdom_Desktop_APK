<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winsdom - Módulo de Modelagem & Arquitetura de Dados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap");

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; user-select: none; }
    body { background: #0f172a; color: #e2e8f0; display: flex; flex-direction: column; }

    /* Header */
    .app-header {
      height: 56px; border-bottom: 1px solid #1e293b; background: rgba(15,23,42,0.85);
      backdrop-filter: blur(12px); padding: 0 16px; display: flex; align-items: center;
      justify-content: space-between; flex-shrink: 0; z-index: 30;
    }
    .header-brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 32px; height: 32px; border-radius: 8px; background: #6366f1;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #fff; font-size: 14px;
      box-shadow: 0 4px 12px rgba(99,102,241,0.3);
    }
    .brand-title { font-size: 13px; font-weight: 600; color: #cbd5e1; }
    .brand-sub { font-size: 10px; color: #64748b; }

    /* Tabs */
    .tab-bar { display: flex; background: #0f172a; padding: 4px; border-radius: 8px; border: 1px solid #1e293b; }
    .tab-btn {
      padding: 6px 16px; font-size: 12px; font-weight: 500; border-radius: 6px;
      border: none; background: transparent; color: #64748b; cursor: pointer; transition: all 0.2s;
    }
    .tab-btn:hover { color: #cbd5e1; }
    .tab-btn.active { background: #6366f1; color: #fff; box-shadow: 0 2px 8px rgba(99,102,241,0.3); }

    /* Header Actions */
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      padding: 8px; border-radius: 6px; border: none; background: transparent;
      color: #94a3b8; cursor: pointer; transition: all 0.15s; display: flex; align-items: center;
    }
    .icon-btn:hover { background: #1e293b; color: #e2e8f0; }
    .icon-btn svg { width: 16px; height: 16px; }
    .action-btn {
      display: flex; align-items: center; gap: 6px; padding: 6px 14px;
      font-size: 12px; font-weight: 600; border-radius: 6px; border: none;
      background: #059669; color: #fff; cursor: pointer; transition: all 0.15s;
      box-shadow: 0 2px 8px rgba(5,150,105,0.25);
    }
    .action-btn:hover { background: #047857; }
    .action-btn svg { width: 16px; height: 16px; }
    .divider { width: 1px; height: 16px; background: #1e293b; }

    /* Canvas */
    .canvas-viewport {
      flex: 1; position: relative; overflow: hidden; cursor: grab;
      background-size: 24px 24px;
      background-image: radial-gradient(circle, #1e293b 1px, transparent 1px);
    }
    .canvas-viewport:active { cursor: grabbing; }

    /* Toolbox */
    .toolbox {
      position: absolute; left: 16px; top: 16px; z-index: 20;
      display: flex; flex-direction: column; gap: 4px;
      background: #1e293b; border: 1px solid #334155; padding: 8px;
      border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .tool-item {
      display: flex; align-items: center; gap: 8px; padding: 8px 12px;
      font-size: 12px; font-weight: 500; border-radius: 8px; border: none;
      background: transparent; color: #cbd5e1; cursor: pointer; transition: all 0.15s;
    }
    .tool-item:hover { background: #334155; }
    .tool-shape {
      width: 14px; height: 14px; border-width: 1.5px; border-style: solid; flex-shrink: 0;
    }
    .shape-entity { border-color: #818cf8; background: rgba(99,102,241,0.15); border-radius: 3px; }
    .shape-weak { border-color: #f59e0b; background: rgba(245,158,11,0.15); border-radius: 3px; border-style: dashed; }
    .shape-rel { border-color: #34d399; background: rgba(16,185,129,0.15); border-radius: 3px; transform: rotate(45deg); }
    .shape-attr { border-color: #fbbf24; background: rgba(251,191,36,0.15); border-radius: 50%; }
    .shape-isa { border-color: #a78bfa; background: rgba(167,139,250,0.15); clip-path: polygon(50% 0%, 0% 100%, 100% 100%); }

    /* SVG Nodes */
    .interactive-node { cursor: move; }
    .interactive-node:hover rect, .interactive-node:hover polygon { filter: brightness(1.15); }

    /* SQL Panel */
    .sql-panel {
      position: absolute; inset: 0; background: #0f172a; z-index: 30;
      display: none; flex-direction: column; padding: 24px;
    }
    .sql-panel.visible { display: flex; }
    .sql-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 16px; border-bottom: 1px solid #1e293b;
    }
    .sql-toolbar select {
      background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
      font-size: 12px; border-radius: 8px; padding: 6px 12px; outline: none;
    }
    .sql-toolbar select:focus { border-color: #6366f1; }
    .copy-btn {
      padding: 6px 16px; font-size: 12px; font-weight: 600; border-radius: 8px;
      border: none; background: #6366f1; color: #fff; cursor: pointer; transition: all 0.15s;
    }
    .copy-btn:hover { background: #4f46e5; }
    /* Media Print para Exportação PDF */
    @media print {
      .app-header, .toolbox, .sql-panel, .property-panel, .tab-bar, .context-menu, .linter-panel {
        display: none !important;
      }
      body, .canvas-viewport {
        background: #ffffff !important; /* Fundo branco no PDF */
        overflow: visible !important;
      }
      .canvas-viewport {
        background-image: none !important; /* Remove grid */
      }
      svg {
        /* Garante que os SVGs fiquem com cores boas e quebrem corretamente */
        color-adjust: exact !important;
        -webkit-print-color-adjust: exact !important;
      }
      text {
        fill: #000000 !important; /* Texto escuro no PDF */
      }
      /* Ajuste dos elementos SVG para branco/preto */
      rect, polygon, ellipse, path {
        stroke: #000000 !important;
        fill: #ffffff !important;
      }
      /* Linhas de relacionamento */
      line {
        stroke: #000000 !important;
      }
    }
    #sqlCodeOutput {
      flex: 1; margin-top: 16px; background: #1e293b; border: 1px solid #334155;
      border-radius: 12px; padding: 16px; font-family: 'Fira Code', 'Cascadia Code', monospace;
      font-size: 12px; color: #cbd5e1; resize: none; outline: none; line-height: 1.7;
    }

    /* Properties Panel (edição de nó selecionado) */
    .props-panel {
      position: absolute; right: 16px; top: 16px; z-index: 20;
      width: 260px; background: #1e293b; border: 1px solid #334155;
      border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      padding: 16px; display: none; flex-direction: column; gap: 12px;
    }
    .props-panel.visible { display: flex; }
    .props-panel h4 { font-size: 12px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; }
    .props-panel label { font-size: 11px; color: #64748b; font-weight: 500; }
    .props-panel input, .props-panel select {
      width: 100%; background: #0f172a; border: 1px solid #334155; color: #e2e8f0;
      font-size: 12px; border-radius: 6px; padding: 6px 10px; outline: none;
    }
    .props-panel input:focus, .props-panel select:focus { border-color: #6366f1; }
    .attr-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; }
    .attr-row input[type="text"] { flex: 1; }
    .attr-row input[type="checkbox"] { width: 14px; height: 14px; accent-color: #6366f1; }
    .small-btn {
      padding: 4px 10px; font-size: 11px; font-weight: 600; border-radius: 6px;
      border: none; cursor: pointer; transition: all 0.15s;
    }
    .btn-add { background: #1e40af; color: #fff; }
    .btn-add:hover { background: #1d4ed8; }
    .btn-del { background: #7f1d1d; color: #fca5a5; }
    .btn-del:hover { background: #991b1b; }

    /* Linter Panel */
    .linter-panel {
      position: absolute; bottom: 16px; left: 16px; z-index: 25; width: 320px;
      background: #1e293b; border: 1px solid #334155; border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4); display: none; flex-direction: column;
      overflow: hidden;
    }
    .linter-panel.visible { display: flex; }
    .linter-header {
      background: #0f172a; padding: 12px 16px; font-size: 12px; font-weight: 600;
      color: #94a3b8; border-bottom: 1px solid #334155; display: flex;
      justify-content: space-between; align-items: center;
    }
    .linter-list { max-height: 200px; overflow-y: auto; }
    .linter-item {
      padding: 12px 16px; border-bottom: 1px solid #334155; font-size: 11px;
      display: flex; gap: 8px; align-items: flex-start; line-height: 1.4;
    }
    .linter-item:last-child { border-bottom: none; }
    .linter-icon { width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px; }
    .severity-error { color: #f87171; }
    .severity-warning { color: #fbbf24; }
    .severity-info { color: #60a5fa; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-brand">
      <div class="brand-icon">W</div>
      <div>
        <div class="brand-title">Winsdom Data Modeler</div>
        <div class="brand-sub">Formalismo EER · Heuser & Elmasri-Navathe</div>
      </div>
    </div>

    <nav class="tab-bar" role="tablist">
      <button id="tabConceptual" class="tab-btn active">Modelo Conceitual</button>
      <button id="tabLogical" class="tab-btn">Modelo Lógico Relacional</button>
      <button id="tabSql" class="tab-btn">Exportar DDL SQL</button>
    </nav>

    <div class="header-actions">
      <select id="notationSelect" style="background:#1e293b;border:1px solid #334155;color:#e2e8f0;font-size:12px;border-radius:6px;padding:4px 8px;outline:none;margin-right:8px;">
        <option value="CHEN">Notação: Peter Chen</option>
        <option value="MERISE">Notação: Merise (França)</option>
      </select>
      <button id="btnUndo" class="icon-btn" title="Desfazer (Ctrl+Z)">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
      </button>
      <button id="btnRedo" class="icon-btn" title="Refazer (Ctrl+Y)">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 10h-10a8 8 0 00-8 8v2m18-10l-6 6m6-6l-6-6"/></svg>
      </button>
      <div class="divider"></div>
      <button id="btnTransform" class="action-btn">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        <span>Transformar (7 Passos)</span>
      </button>
      <button id="btnExportSvg" class="icon-btn" title="Exportar Imagem SVG">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      </button>
    </div>
  </header>

  <!-- Main -->
  <main style="flex:1; position:relative; overflow:hidden; display:flex;">

    <!-- Toolbox Conceitual -->
    <aside id="conceptualTools" class="toolbox">
      <button id="btnAddEntity" class="tool-item">
        <div class="tool-shape shape-entity"></div> Entidade Forte
      </button>
      <button id="btnAddWeakEntity" class="tool-item">
        <div class="tool-shape shape-weak"></div> Entidade Fraca
      </button>
      <button id="btnAddRel" class="tool-item">
        <div class="tool-shape shape-rel"></div> Relacionamento
      </button>
      <button id="btnAddAttribute" class="tool-item">
        <div class="tool-shape shape-attr"></div> Atributo
      </button>
      <button id="btnAddEdge" class="tool-item" style="border-top: 1px solid #334155; padding-top: 12px; margin-top: 4px;">
        <svg width="14" height="14" fill="none" stroke="#94a3b8" stroke-width="2"><line x1="2" y1="12" x2="12" y2="2"/></svg>
        Conectar (Aresta)
      </button>
      <button id="btnAddHierarchy" class="tool-item" style="border-top: 1px solid #334155; padding-top: 12px; margin-top: 4px;">
        <svg width="14" height="14" fill="none" stroke="#a78bfa" stroke-width="2"><polygon points="7,1 13,13 1,13"/></svg>
        Herança (ISA)
      </button>
    </aside>

    <!-- Properties Panel -->
    <div id="propsPanel" class="props-panel">
      <h4 id="propsTitle">Propriedades</h4>
      <div id="propsContent"></div>
    </div>

    <!-- Canvas SVG -->
    <div id="canvasViewport" class="canvas-viewport">
      <svg id="svgRoot" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- ONE side: || (Mandatory One) -->
          <marker id="crowsfoot-one" markerWidth="24" markerHeight="20" refX="24" refY="10" orient="auto-start-reverse">
            <path d="M 0,10 L 24,10 M 12,2 L 12,18 M 18,2 L 18,18" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
          </marker>
          <!-- MANY side: >O (Zero or Many) -->
          <marker id="crowsfoot-many" markerWidth="24" markerHeight="20" refX="24" refY="10" orient="auto">
            <path d="M 0,10 L 6,10 M 14,10 L 24,2 M 14,10 L 24,18 M 14,10 L 24,10" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
            <circle cx="10" cy="10" r="4" fill="none" stroke="#94a3b8" stroke-width="1.8"/>
          </marker>
        </defs>
        <g id="viewportGroup" transform="matrix(1 0 0 1 0 0)">
          <g id="edgesLayer"></g>
          <g id="nodesLayer"></g>
        </g>
      </svg>
    </div>

    <!-- SQL Panel -->
    <section id="sqlPanel" class="sql-panel">
      <div class="sql-toolbar">
        <div>
          <label style="color:#cbd5e1; font-size:12px; margin-right:8px;">Dialeto SQL:</label>
          <select id="dialectSelect" class="props-select" style="width:140px; margin-right:12px;">
            <option value="postgres">PostgreSQL</option>
            <option value="mysql">MySQL</option>
            <option value="sqlite">SQLite</option>
            <option value="prisma">Prisma Schema</option>
            <option value="drizzle">Drizzle ORM</option>
          </select>
          <label style="color:#cbd5e1; font-size:12px; display:inline-flex; align-items:center; gap:4px;">
            <input type="checkbox" id="bitemporalCheck"> Suporte Bitemporal (Histórico)
          </label>
        </div>
        <button id="btnCopySql" class="copy-btn">Copiar SQL</button>
      </div>
      <textarea id="sqlCodeOutput" readonly></textarea>
    </section>
    <div id="linterPanel" class="linter-panel">
      <div class="linter-header">
        <span style="display:flex;align-items:center;gap:6px;">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          Diagnóstico Semântico
        </span>
        <span id="linterBadge" style="background:#334155;color:#e2e8f0;padding:2px 6px;border-radius:10px;font-size:10px;">0</span>
      </div>
      <div id="linterList" class="linter-list"></div>
    </div>
  </main>

  <script src="scripts/SemanticLinter.js"></script>
  <script src="scripts/MultiNotationProjector.js"></script>
  <script src="scripts/PrismaTranspiler.js"></script>
  <script src="scripts/DrizzleTranspiler.js"></script>
  <script src="scripts/ITState.js"></script>
  <script src="scripts/RelationalMappingEngine.js"></script>
  <script src="scripts/OrthogonalRouter.js"></script>
  <script src="scripts/SqlTranspiler.js"></script>
  <script src="scripts/IT.js"></script>
</body>
</html>
